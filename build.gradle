plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pocketdoor" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

configurations {
    immersivePortalBundle
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Immersive Portals 2.3.2 for Minecraft 1.19.2.
    // The full Modrinth jar contains the exact matching 2.3.2 Core + QMiscUtil jars.
    immersivePortalBundle "maven.modrinth:zJpHMkdD:WC8jIRwS"
    // Use explicit file dependencies because fileTree is evaluated before the
    // extraction task has created the jars.
    modImplementation files(
            "libs/imm_ptl_core-2.3.2.jar",
            "libs/q_misc_util-2.3.2.jar"
    )
}

// Extract the exact Core/QMiscUtil jars from Immersive Portals 2.3.2.
// This avoids accidentally running the incompatible 2.0.0 core that was bundled previously.
tasks.register("prepareImmersivePortals") {
    outputs.files(
            file("libs/imm_ptl_core-2.3.2.jar"),
            file("libs/q_misc_util-2.3.2.jar")
    )

    doLast {
        def bundle = configurations.immersivePortalBundle.singleFile
        def targets = [
                "META-INF/jars/imm_ptl_core-2.3.2.jar": file("libs/imm_ptl_core-2.3.2.jar"),
                "META-INF/jars/q_misc_util-2.3.2.jar": file("libs/q_misc_util-2.3.2.jar")
        ]

        new java.util.zip.ZipFile(bundle).withCloseable { zip ->
            targets.each { entryName, targetFile ->
                if (!targetFile.parentFile.exists()) {
                    targetFile.parentFile.mkdirs()
                }
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("Immersive Portals 2.3.2: missing nested jar " + entryName)
                }
                zip.getInputStream(entry).withCloseable { input ->
                    targetFile.withOutputStream { output ->
                        output << input
                    }
                }
            }
        }
    }
}

tasks.register("exportTypewriterMeshes") {
    // Blockbench stores cube transforms in the cube and in every outliner
    // group above it.  Keep the .bbmodel files as the source of truth.
    inputs.files(
            file("blockbench/Machine_a_ecrire.bbmodel"),
            file("blockbench/Machine_a_ecrire_sans_papier.bbmodel")
    )
    outputs.files(
            file("src/main/resources/assets/pocketdoor/typewriter_model.pdmesh"),
            file("src/main/resources/assets/pocketdoor/typewriter_model_empty.pdmesh")
    )

    doLast {
        def exportMesh = { File source, File target ->
            def model = new groovy.json.JsonSlurper().parse(source)
            def byUuid = model.elements.collectEntries { e -> [(e.uuid): e] }
            def identity = { ->
                [[1d,0d,0d,0d],[0d,1d,0d,0d],[0d,0d,1d,0d],[0d,0d,0d,1d]]
            }
            def mul = { a, b ->
                (0..3).collect { i -> (0..3).collect { j ->
                    (0..3).collect { k -> a[i][k] * b[k][j] }.sum() as double
                }}
            }
            def translation = { p ->
                def m=identity(); m[0][3]=p[0] as double; m[1][3]=p[1] as double; m[2][3]=p[2] as double; m
            }
            def rotation = { r ->
                double rx=Math.toRadians((r?.getAt(0) ?: 0) as double)
                double ry=Math.toRadians((r?.getAt(1) ?: 0) as double)
                double rz=Math.toRadians((r?.getAt(2) ?: 0) as double)
                double cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry), sy=Math.sin(ry), cz=Math.cos(rz), sz=Math.sin(rz)
                // Blockbench's XYZ Euler rotation: R = Rz * Ry * Rx.
                [[cy*cz, cz*sy*sx-sz*cx, cz*sy*cx+sz*sx,0d],
                 [cy*sz, sz*sy*sx+cz*cx, sz*sy*cx-cz*sx,0d],
                 [-sy,   cy*sx,          cy*cx,          0d],
                 [0d,0d,0d,1d]]
            }
            def around = { origin, rot ->
                mul(mul(translation(origin), rotation(rot)), translation(origin.collect { -(it as double) }))
            }
            def apply = { m, p ->
                [0,1,2].collect { i -> (0..3).collect { k -> m[i][k] * ((k<3 ? p[k] : 1) as double) }.sum() as double }
            }
            def worldByUuid = [:]
            def walk
            walk = { nodes, parent ->
                (nodes ?: []).each { node ->
                    if (node instanceof String) {
                        if (byUuid.containsKey(node)) worldByUuid[node] = parent
                    } else if (node instanceof Map) {
                        def o=node.origin ?: [0d,0d,0d]
                        def r=node.rotation ?: [0d,0d,0d]
                        // A group's pivot is in model coordinates, not relative
                        // to its children.  Therefore compose parent * pivotRotation.
                        def groupWorld=mul(parent, around(o,r))
                        walk(node.children ?: [], groupWorld)
                    }
                }
            }
            walk(model.outliner ?: [], identity())
            model.elements.each { e -> if (!worldByUuid.containsKey(e.uuid)) worldByUuid[e.uuid]=identity() }

            def faces=[]; def allVertices=[]
            def cross = { a,b -> [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]] }
            def normalize = { v -> double l=Math.sqrt(v.collect{it*it}.sum() as double); l==0 ? [0d,1d,0d] : v.collect{it/l} }
            model.elements.each { element ->
                if (element.export == false || element.visibility == false) return
                def local = around(element.origin ?: [0d,0d,0d], element.rotation ?: [0d,0d,0d])
                def transform = mul(worldByUuid[element.uuid] ?: identity(), local)
                (element.faces ?: [:]).each { faceId, face ->
                    if (!(face.texture instanceof Number)) return
                    int ti=face.texture as int
                    if (ti<0 || ti >= (model.textures?.size() ?: 0)) return
                    def verts=[]
                    (face.vertices ?: []).each { id ->
                        def point=element.vertices[id]; def uv=(face.uv ?: [:])[id]
                        if (point != null && uv != null) {
                            def q=apply(transform,point)
                            verts << [q[0],q[1],q[2],(uv[0] as double)/16d,(uv[1] as double)/16d]
                        }
                    }
                    if (verts.size()<3) return
                    (1..<(verts.size()-1)).each { i ->
                        def tri=[verts[0],verts[i],verts[i+1]]
                        def n=normalize(cross((0..2).collect{tri[1][it]-tri[0][it]},(0..2).collect{tri[2][it]-tri[0][it]}))
                        faces << [ti,n,tri]; allVertices.addAll(tri)
                    }
                }
            }
            if (faces.isEmpty()) throw new GradleException("No typewriter mesh faces exported from " + source)
            double minX=allVertices.collect{it[0] as double}.min(), maxX=allVertices.collect{it[0] as double}.max()
            double minY=allVertices.collect{it[1] as double}.min(), maxY=allVertices.collect{it[1] as double}.max()
            double minZ=allVertices.collect{it[2] as double}.min(), maxZ=allVertices.collect{it[2] as double}.max()
            double height=maxY-minY
            if (height<=0d) throw new GradleException("Invalid typewriter mesh height in " + source)
            double cx=(minX+maxX)/2d, cz=(minZ+maxZ)/2d
            target.parentFile.mkdirs()
            target.withOutputStream { raw ->
                def out=new DataOutputStream(raw); out.writeBytes("PDM1")
                out.writeInt(model.textures.size())
                (0..<model.textures.size()).each { i -> def n="typewriter_${i}.png"; byte[] b=n.getBytes("UTF-8"); out.writeShort(b.length); out.write(b) }
                out.writeInt(faces.size())
                faces.each { f ->
                    out.writeInt(f[0] as int); f[1].each{out.writeFloat(it as float)}; out.writeInt(3)
                    f[2].each { v -> out.writeFloat((((v[0]-cx)/height*16d) as float)); out.writeFloat((((v[1]-minY)/height*16d) as float)); out.writeFloat((((v[2]-cz)/height*16d) as float)); out.writeFloat(v[3] as float); out.writeFloat(v[4] as float) }
                }
                out.flush()
            }
        }
        def assets=file("src/main/resources/assets/pocketdoor")
        exportMesh(file("blockbench/Machine_a_ecrire.bbmodel"),new File(assets,"typewriter_model.pdmesh"))
        exportMesh(file("blockbench/Machine_a_ecrire_sans_papier.bbmodel"),new File(assets,"typewriter_model_empty.pdmesh"))
    }
}

tasks.named("processResources") {
    dependsOn(tasks.named("exportTypewriterMeshes"))
}

// FIX: toute tâche Jar de sources lit src/main/resources, où
// exportTypewriterMeshes écrit. Gradle 9 exige une dépendance explicite.
// tasks.matching s'applique dès que la tâche existe, quel que soit l'ordre.
tasks.matching { it.name == "sourcesJar" || it.name == "remapSourcesJar" }.configureEach {
    dependsOn(tasks.named("exportTypewriterMeshes"))
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(tasks.named("prepareImmersivePortals"))
}

tasks.named("runClient") {
    dependsOn(tasks.named("prepareImmersivePortals"))
}

// Gradle 9.x validates task dependencies strictly. Loom's remap classpath
// consumes the jars generated by prepareImmersivePortals, so declare that
// dependency explicitly as well.
tasks.named("generateRemapClasspath") {
    dependsOn(tasks.named("prepareImmersivePortals"))
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}