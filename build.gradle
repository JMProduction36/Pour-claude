
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pocketdoor" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    immersivePortalBundle
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Paquet contenant les versions exactes d'Immersive Portals utilisées.
    immersivePortalBundle "maven.modrinth:zJpHMkdD:WC8jIRwS"

    // Utilisation des JAR locaux pour compiler PocketDoor.
    modImplementation files(
            "libs/imm_ptl_core-2.3.2.jar",
            "libs/q_misc_util-2.3.2.jar"
    )
}

/*
 * Extrait Immersive Portals et QMiscUtil du paquet Modrinth.
 */
tasks.register("prepareImmersivePortals") {
    outputs.files(
            file("libs/imm_ptl_core-2.3.2.jar"),
            file("libs/q_misc_util-2.3.2.jar")
    )

    doLast {
        def bundle = configurations.immersivePortalBundle.singleFile

        def targets = [
                "META-INF/jars/imm_ptl_core-2.3.2.jar":
                        file("libs/imm_ptl_core-2.3.2.jar"),
                "META-INF/jars/q_misc_util-2.3.2.jar":
                        file("libs/q_misc_util-2.3.2.jar")
        ]

        targets.each { entryName, targetFile ->
            if (!targetFile.parentFile.exists()) {
                targetFile.parentFile.mkdirs()
            }
        }

        new java.util.zip.ZipFile(bundle).withCloseable { zip ->
            targets.each { entryName, targetFile ->
                def entry = zip.getEntry(entryName)

                if (entry == null) {
                    throw new GradleException(
                            "Fichier manquant dans Immersive Portals : " + entryName
                    )
                }

                zip.getInputStream(entry).withCloseable { input ->
                    targetFile.withOutputStream { output ->
                        output << input
                    }
                }
            }
        }
    }
}

// Prépare les dépendances avant la compilation.
tasks.withType(JavaCompile).configureEach {
    dependsOn(tasks.named("prepareImmersivePortals"))
    options.release = 17
}

tasks.named("runClient") {
    dependsOn(tasks.named("prepareImmersivePortals"))
}

tasks.named("generateRemapClasspath") {
    dependsOn(tasks.named("prepareImmersivePortals"))
}

/*
 * CORRECTION :
 * Les JAR sont ajoutés comme dépendances imbriquées par Loom.
 * On ne doit PAS utiliser "include" sur les fichiers JAR locaux.
 */
tasks.named("remapJar") {
    dependsOn(tasks.named("prepareImmersivePortals"))

    nestedJars.from(
            file("libs/imm_ptl_core-2.3.2.jar"),
            file("libs/q_misc_util-2.3.2.jar")
    )

    addNestedDependencies = true
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
